<script>

// Keep it shrimple: a few words have a 5% chance each to become a sea-food pun on each visit
// ("simple" -> "shrimple", "really" -> "krilly"...). Whole words only, capitals kept, code left alone.
(function ()
{
    const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT,
    {
        acceptNode(node)
        {
            return node.parentElement && node.parentElement.closest('code, pre, script, style, textarea')
                ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT;
        }
    });
    const nodes = [];
    while (walker.nextNode())
    {
        nodes.push(walker.currentNode);
    }
    const puns = [
        [/\bsimple\b/gi, 'shrimple'], [/\bsimply\b/gi, 'shrimply'], [/\bperfect\b/gi, 'prawnfect'],
        [/\breally\b/gi, 'krilly'], [/\bsure\b/gi, 'shore'], [/\bcalm\b/gi, 'clam'],
        [/\bshell\b/gi, 'shellfish'], [/\boh my god\b/gi, 'oh my cod']
    ];
    // The pun in the word's own capitals: Simple -> Shrimple, SIMPLE -> SHRIMPLE
    function sameCase(word, pun)
    {
        if (word === word.toUpperCase())
        {
            return pun.toUpperCase();
        }
        return word[0] === word[0].toUpperCase() ? pun[0].toUpperCase() + pun.slice(1) : pun;
    }
    for (const node of nodes)
    {
        let text = node.nodeValue;
        for (const [pattern, pun] of puns)
        {
            text = text.replace(pattern, word => Math.random() < 0.05 ? sameCase(word, pun) : word);
        }
        node.nodeValue = text;
    }
})();
</script>
